pipeline: development-pipeline
version: 2

defaults:
  skills:
    - active-listener
    - mental-model

orchestrator:
  entrypoint: development-pipeline-orchestrator
  role: single-user-interface
  skills:
    - development-pipeline-shared-orchestrator
  domain:
    read: ["**/*"]
    write: []
  teams:
    - planning
    - engineering
    - validation

teams:
  planning:
    lead: research-lead
    color: blue
    skills:
      - development-pipeline-shared-orchestrator
    domain:
      read: ["**/*"]
      write: ["docs/research/**", "docs/design/**", "docs/plan/**"]
    stages:
      - research
      - design
      - plan
    members:
      - name: research-subagent-architecture
        skills: [development-pipeline-shared-worker, factual-reporter]
        domain:
          read: ["**/*"]
          write: []
      - name: research-subagent-patterns
        skills: [development-pipeline-shared-worker, factual-reporter]
        domain:
          read: ["**/*"]
          write: []
      - name: research-subagent-integrations
        skills: [development-pipeline-shared-worker, factual-reporter]
        domain:
          read: ["**/*"]
          write: []
      - name: research-subagent-domain
        skills: [development-pipeline-shared-worker, factual-reporter]
        domain:
          read: ["**/*"]
          write: []
      - name: research-subagent-api
        skills: [development-pipeline-shared-worker, factual-reporter]
        domain:
          read: ["**/*"]
          write: []
      - name: research-subagent-tests
        skills: [development-pipeline-shared-worker, factual-reporter]
        domain:
          read: ["**/*"]
          write: []
      - name: research-subagent-fintech-domain
        skills: [development-pipeline-shared-worker, factual-reporter]
        domain:
          read: ["**/*"]
          write: []
      - name: design
        skills: [development-pipeline-shared-orchestrator]
        domain:
          read: ["**/*"]
          write: ["docs/design/**"]
      - name: plan
        skills: [development-pipeline-shared-orchestrator, vertical-slice-enforcer]
        domain:
          read: ["**/*"]
          write: ["docs/plan/**"]

  engineering:
    lead: implement-lead
    color: cyan
    skills:
      - development-pipeline-shared-orchestrator
    domain:
      read: ["**/*"]
      write: []
    stages:
      - implement
    members:
      - name: implement-coder
        skills: [development-pipeline-shared-worker, scope-guardian]
        domain:
          read: ["**/*"]
          write: ["src/**", "tests/**", "config/**"]

  validation:
    lead: validation-lead
    color: amber
    skills:
      - development-pipeline-shared-orchestrator
    domain:
      read: ["**/*"]
      write: []
    members:
      - name: validation-lead
        skills: [development-pipeline-shared-orchestrator]
        domain:
          read: ["**/*"]
          write: []
      - name: reviewer-quality
        skills: [development-pipeline-shared-reviewer]
        domain:
          read: ["**/*"]
          write: []
      - name: reviewer-architecture
        skills: [development-pipeline-shared-reviewer]
        domain:
          read: ["**/*"]
          write: []
      - name: reviewer-security
        skills: [development-pipeline-shared-reviewer]
        domain:
          read: ["**/*"]
          write: []
      - name: reviewer-plan-compliance
        skills: [development-pipeline-shared-reviewer]
        domain:
          read: ["**/*"]
          write: []
      - name: reviewer-fintech-compliance
        skills: [development-pipeline-shared-reviewer]
        domain:
          read: ["**/*"]
          write: []
      - name: reviewer-fintech-patterns
        skills: [development-pipeline-shared-reviewer]
        domain:
          read: ["**/*"]
          write: []
      - name: tester
        skills: [development-pipeline-shared-worker]
        domain:
          read: ["**/*"]
          write: []
