pipeline: development-pipeline
version: 2

defaults:
  model: sonnet
  skills:
    - active-listener
    - mental-model

orchestrator:
  entrypoint: development-pipeline-orchestrator
  role: single-user-interface
  skills:
    - zero-micromanagement
    - conversational-response
  domain:
    read: ["**/*"]
    write: []
  teams:
    - planning
    - engineering
    - validation

teams:
  planning:
    lead: research-lead
    color: blue
    skills:
      - zero-micromanagement
      - conversational-response
    domain:
      read: ["**/*"]
      write: ["docs/research/**", "docs/design/**", "docs/plan/**"]
    stages:
      - research
      - design
      - plan
    members:
      - name: research-subagent-architecture
        model: haiku
        skills: [factual-reporter, verbose-worker]
        domain:
          read: ["**/*"]
          write: []
      - name: research-subagent-patterns
        model: haiku
        skills: [factual-reporter, verbose-worker]
        domain:
          read: ["**/*"]
          write: []
      - name: research-subagent-integrations
        model: haiku
        skills: [factual-reporter, verbose-worker]
        domain:
          read: ["**/*"]
          write: []
      - name: research-subagent-domain
        model: haiku
        skills: [factual-reporter, verbose-worker]
        domain:
          read: ["**/*"]
          write: []
      - name: research-subagent-api
        model: haiku
        skills: [factual-reporter, verbose-worker]
        domain:
          read: ["**/*"]
          write: []
      - name: research-subagent-tests
        model: haiku
        skills: [factual-reporter, verbose-worker]
        domain:
          read: ["**/*"]
          write: []
      - name: research-subagent-fintech-domain
        model: sonnet
        skills: [factual-reporter, verbose-worker]
        domain:
          read: ["**/*"]
          write: []
      - name: design
        model: opus
        skills: [conversational-response]
        domain:
          read: ["**/*"]
          write: ["docs/design/**"]
      - name: plan
        skills: [vertical-slice-enforcer, conversational-response]
        domain:
          read: ["**/*"]
          write: ["docs/plan/**"]

  engineering:
    lead: implement-lead
    color: cyan
    skills:
      - zero-micromanagement
      - conversational-response
    domain:
      read: ["**/*"]
      write: []
    stages:
      - implement
    members:
      - name: implement-coder
        skills: [scope-guardian, verbose-worker]
        domain:
          read: ["**/*"]
          write: ["src/**", "tests/**", "config/**"]

  validation:
    lead: validation-lead
    color: amber
    skills:
      - zero-micromanagement
      - conversational-response
    domain:
      read: ["**/*"]
      write: []
    members:
      - name: validation-lead
        model: opus
        skills: [zero-micromanagement, conversational-response]
        domain:
          read: ["**/*"]
          write: []
      - name: reviewer-quality
        skills: [actionable-reviewer]
        domain:
          read: ["**/*"]
          write: []
      - name: reviewer-architecture
        skills: [actionable-reviewer]
        domain:
          read: ["**/*"]
          write: []
      - name: reviewer-security
        skills: [actionable-reviewer]
        domain:
          read: ["**/*"]
          write: []
      - name: reviewer-plan-compliance
        skills: [actionable-reviewer]
        domain:
          read: ["**/*"]
          write: []
      - name: reviewer-fintech-compliance
        skills: [actionable-reviewer]
        domain:
          read: ["**/*"]
          write: []
      - name: reviewer-fintech-patterns
        skills: [actionable-reviewer]
        domain:
          read: ["**/*"]
          write: []
      - name: tester
        skills: [verbose-worker]
        domain:
          read: ["**/*"]
          write: []
